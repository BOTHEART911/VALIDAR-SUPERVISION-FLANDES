<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="340" height="64" role="img" aria-label="Escríbeme un correo">
<title>Escríbeme un correo</title>
<style>
@keyframes barrido{0%{transform:translateX(-160px)}55%,100%{transform:translateX(420px)}}
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.barrido{animation:barrido 3.6s ease-in-out infinite}
.late{animation:late 2.2s ease-in-out infinite;transform-origin:34px 32px}
</style>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ea4335"/><stop offset="1" stop-color="#b31412"/></linearGradient>
<linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="2" y="2" width="336" height="60" rx="30"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect x="2" y="2" width="336" height="60" fill="url(#g)"/>
<rect class="barrido" x="0" y="0" width="120" height="64" fill="url(#b)" transform="skewX(-20)"/>
</g>
<g class="late" transform="translate(8 6)"><g transform="scale(1)"><rect x="10" y="14" width="32" height="24" rx="4" fill="#fff"/><path d="M12 17l14 11 14-11" fill="none" stroke="#b31412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g>
<text x="72" y="29" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">Escríbeme un correo</text>
<text x="72" y="48" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="500" fill="#fff" fill-opacity=".85">opolania11@gmail.com</text>
</svg>
